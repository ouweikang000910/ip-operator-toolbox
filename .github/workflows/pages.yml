name: Publish toolbox and update topic radar

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify radar
        run: npm test
      - uses: actions/cache@v4
        with:
          path: .radar-cache
          key: radar-${{ github.run_id }}
          restore-keys: radar-
      - name: Prepare public website
        run: node scripts/build-pages.mjs
      - name: Refresh today's topics
        run: node scripts/update-radar.mjs
        env:
          RADAR_HISTORY_URL: https://ouweikang000910.github.io/ip-operator-toolbox/radar-search.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
